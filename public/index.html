<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialClip Pro - Clean Video Downloader</title>

    <meta name="monetag" content="f62142c5ca13d35f2ef65cbe1a18827e">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #0f1015;
            --card: #1a1c23;
            --accent: #dc2743;
            --text: #ffffff;
            --subtext: #9a9cab;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); display:flex; flex-direction:column; align-items:center; min-height:100vh; }
        
        header { width:100%; padding:18px 0; text-align:center; background: rgba(26,28,35,0.9); border-bottom:1px solid rgba(255,255,255,0.05); }
        .logo { font-size:1.6rem; font-weight:700; color: var(--accent); }

        .container { width:100%; max-width:750px; padding:20px; }
        
        /* Clean Banner Spaces (Disciplined Ads) */
        .ad-banner { width:100%; height:90px; background:rgba(255,255,255,0.02); border:1px dashed rgba(255,255,255,0.1); border-radius:8px; display:flex; align-items:center; justify-content:center; margin:15px 0; color:var(--subtext); font-size:0.8rem; }

        .downloader-card { background: var(--card); padding:30px 20px; border-radius:14px; text-align:center; border:1px solid rgba(255,255,255,0.05); }
        
        .input-box { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
        .input-box input { flex:1; min-width:240px; padding:14px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); background:#000; color:#fff; outline:none; }
        .btn-submit { padding:14px 24px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }

        /* Video Result Preview Card */
        .result-card { display:none; background:var(--card); margin-top:20px; border-radius:14px; padding:20px; border:1px solid rgba(255,255,255,0.1); text-align:left; }
        .result-title { font-size:1rem; margin-bottom:15px; color:#fff; }
        .download-options { display:flex; flex-direction:column; gap:10px; }
        .dl-btn { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05); padding:12px 16px; border-radius:8px; text-decoration:none; color:#fff; font-size:0.9rem; transition:0.2s; }
        .dl-btn:hover { background:var(--accent); }
    </style>
</head>
<body>

    <header><div class="logo"><i class="fa-solid fa-circle-down"></i> SocialClip Pro</div></header>

    <div class="container">
        <!-- Top Ad Space -->
        <div class="ad-banner">Monetag Header Banner (Native)</div>

        <div class="downloader-card">
            <h2>Paste Video URL to Download</h2>
            <form id="dl-form">
                <div class="input-box">
                    <input type="url" id="video-url" placeholder="Paste Reel, TikTok, Shorts URL..." required>
                    <button type="submit" class="btn-submit" id="btn-text">Get Download Links</button>
                </div>
            </form>
        </div>

        <!-- Video Download Options Card -->
        <div class="result-card" id="result-box">
            <div class="result-title" id="res-title">Ready for Download</div>
            <div class="download-options" id="options-container">
                <!-- Direct Clean Download Links -->
            </div>
        </div>

        <!-- Middle Ad Space -->
        <div class="ad-banner">Monetag Middle Banner (Native)</div>
    </div>

<script>
    document.getElementById('dl-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const url = document.getElementById('video-url').value;
        const btn = document.getElementById('btn-text');
        const resultBox = document.getElementById('result-box');
        const container = document.getElementById('options-container');

        btn.innerText = 'Fetching...';
        btn.disabled = true;

        try {
            const res = await fetch('/api/fetch-info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });

            const data = await res.json();

            if (data.status === 'success') {
                container.innerHTML = '';
                
                if (data.downloadUrl) {
                    container.innerHTML += `
                        <a href="${data.downloadUrl}" target="_blank" class="dl-btn">
                            <span><i class="fa-solid fa-video"></i> HD Video (MP4)</span>
                            <span style="font-weight:bold;">Direct Download <i class="fa-solid fa-arrow-down"></i></span>
                        </a>`;
                }

                if (data.picker && data.picker.length > 0) {
                    data.picker.forEach((item, index) => {
                        container.innerHTML += `
                            <a href="${item.url}" target="_blank" class="dl-btn">
                                <span><i class="fa-solid fa-film"></i> Quality Option ${index + 1}</span>
                                <span>Download</span>
                            </a>`;
                    });
                }

                resultBox.style.display = 'block';
            } else {
                alert('Could not fetch video. Please check URL.');
            }
        } catch (err) {
            alert('Server error, try again.');
        } finally {
            btn.innerText = 'Get Download Links';
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
